name: Release

# A cada push no main (merge do PR develop -> main): o Semantic Release calcula a
# versao pelos Conventional Commits, cria a tag e a GitHub Release. Se houve versao
# nova, publica as imagens com essa versao e atualiza a producao (com aprovacao).
on:
  push:
    branches: [main]

# Um release por vez; o seguinte espera o atual terminar.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.result.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: urban-web/.nvmrc

      - name: Instalar o Semantic Release
        working-directory: .github/release
        run: npm ci --ignore-scripts

      - name: Calcular a versao, criar a tag e a GitHub Release
        working-directory: .github/release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./node_modules/.bin/semantic-release

      - name: Ler a versao publicada
        id: result
        run: |
          git fetch --tags --force
          TAG="$(git tag --points-at HEAD --list 'v*' | head -n 1)"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Versao deste commit: ${TAG:-nenhuma (sem mudancas que gerem release)}"

  images:
    name: Imagens
    needs: version
    if: needs.version.outputs.version != ''
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      tag: ${{ needs.version.outputs.version }}
      version: ${{ needs.version.outputs.version }}

  deploy:
    name: Producao
    needs: [version, images]
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      tag: ${{ needs.version.outputs.version }}
      web-port: "5200"
    secrets: inherit
