name: CD

# A cada push no develop: publica as imagens no GHCR e atualiza o staging no VPS.
# (O deploy de producao entra junto com o Semantic Release.)
on:
  push:
    branches: [develop]

# Um deploy por vez por branch; o seguinte espera o atual terminar.
concurrency:
  group: cd-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  images:
    name: Publicar imagens (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Definir tag e nome das imagens
        id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build e push da API
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f infra/Dockerfile.api \
            --build-arg "VERSION=0.0.0-${TAG}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${PREFIX}/api:${TAG}" .
          docker push "${PREFIX}/api:${TAG}"

      - name: Build e push do frontend
        env:
          PREFIX: ${{ steps.meta.outputs.prefix }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          docker build -f infra/Dockerfile.frontend \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t "${PREFIX}/web:${TAG}" .
          docker push "${PREFIX}/web:${TAG}"

  deploy-staging:
    name: Deploy no staging
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      WEB_PORT: "5210"
      TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Preparar SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Enviar arquivos de deploy
        run: |
          scp -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            infra/deploy/docker-compose.yml infra/deploy/deploy.sh \
            "${VPS_USER}@${VPS_HOST}:urban/staging/"

      - name: Executar deploy
        run: |
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${VPS_USER}@${VPS_HOST}" \
            "bash ~/urban/staging/deploy.sh staging ${TAG} ${WEB_PORT}"
