name: .NET CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# Cancela execucoes antigas do mesmo PR quando chega um commit novo.
concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Principio do menor privilegio: o workflow so le o repositorio.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instala o .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: Directory.Packages.props

      - name: Restore
        run: dotnet restore Urban.slnx

      - name: Build
        run: dotnet build Urban.slnx --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test Urban.slnx
          --configuration Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      - name: Publica resultados e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7