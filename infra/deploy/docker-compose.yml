# Stack de deploy do Urban. Staging e producao usam este mesmo arquivo; o que
# muda entre eles vem do arquivo .env ao lado, escrito pelo deploy.sh:
#   URBAN_ENV               staging | production (nome do projeto e da rede)
#   URBAN_TAG               tag das imagens no GHCR
#   WEB_PORT                porta em 127.0.0.1 onde o nginx do servidor encontra o web
#   ASPNETCORE_ENVIRONMENT  Staging | Production
#   POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SIGNING_KEY
#                           segredos: vem do secrets.env (enviado pelo workflow de deploy a
#                           partir dos secrets do Environment do GitHub), nunca do repositorio
name: urban-${URBAN_ENV:?defina URBAN_ENV}

# Padroes de todos os servicos: reiniciam sozinhos, sem privilegios extras e com
# log limitado (sem isso o log do Docker cresce ate encher o disco).
x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  # Postgres e Redis ficam so na rede interna do compose: nenhuma porta e publicada no servidor.
  postgres:
    <<: *service-defaults
    image: postgres:18
    # O entrypoint sobe como root, acerta o dono dos arquivos e troca para o usuario postgres.
    # Como o padrao derruba todas as capabilities, devolvemos so as que esse passo exige.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    environment:
      POSTGRES_DB: urban
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      # PostgreSQL 18+: o volume e montado em /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  redis:
    <<: *service-defaults
    image: redis:8
    # AOF ligado: as revogacoes de sessao vivem aqui e nao devem sumir se o Redis reiniciar.
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina REDIS_PASSWORD}", "--appendonly", "yes"]
    # Roda direto como o usuario redis da imagem. Assim o entrypoint nao precisa trocar de usuario
    # (a troca exigia mais capabilities, e o padrao do compose as derruba), e o Redis fica sem nenhuma.
    user: redis
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  api:
    <<: *service-defaults
    image: ghcr.io/aurelth/urban/api:${URBAN_TAG:?defina URBAN_TAG}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=urban;Username=urban;Password=${POSTGRES_PASSWORD}
      ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?defina JWT_SIGNING_KEY}
      Database__MigrateOnStartup: "true"
    mem_limit: 512m

  web:
    <<: *service-defaults
    image: ghcr.io/aurelth/urban/web:${URBAN_TAG:?defina URBAN_TAG}
    depends_on:
      - api
    environment:
      # Ate o Gateway existir, o nginx fala direto com a API.
      API_UPSTREAM: http://api:8080
    ports:
      - 127.0.0.1:${WEB_PORT:?defina WEB_PORT}:8080
    mem_limit: 64m

volumes:
  postgres-data:
  redis-data: