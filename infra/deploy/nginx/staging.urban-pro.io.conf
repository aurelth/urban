# Urban - staging (nginx do servidor, na frente do container web).
# Instalacao unica, manual: copiar para /etc/nginx/sites-available/, ativar com
# link em /etc/nginx/sites-enabled/ e rodar "sudo certbot --nginx -d ..." para o
# HTTPS (o certbot acrescenta o bloco 443 e o redirecionamento, como nos outros
# sites deste servidor). O deploy (GitHub Actions) nao mexe neste arquivo.
server {
    listen 80;
    server_name staging.urban-pro.io;

    # Anexos e uploads maiores que o padrao (1 MB) dariam erro 413.
    client_max_body_size 20m;

    # Homologacao nao deve aparecer em buscadores.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # SignalR (WebSocket): precisa dos cabecalhos Upgrade/Connection.
    location /hubs/ {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:5210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
