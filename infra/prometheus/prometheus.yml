global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]

  # A API do Urban entra aqui quando o projeto existir (no desenvolvimento
  # ela roda no host, por isso host.docker.internal):
  # - job_name: urban-api
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["host.docker.internal:5000"]
