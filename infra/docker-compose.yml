# Urban - infraestrutura local
# Essenciais (sem perfil):  postgres, redis, rabbitmq, garage
# Perfil tools:             pgadmin, seq
# Perfil observability:     jaeger, prometheus, loki, grafana
# Uso (a partir da raiz do repositório):
#   docker compose -f infra/docker-compose.yml up -d
#   docker compose -f infra/docker-compose.yml --profile tools --profile observability up -d
name: urban

services:
  # ==================== ESSENCIAIS ====================
  postgres:
    image: postgres:18
    container_name: urban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina em infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?defina em infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: o volume é montado em /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [urban-net]

  redis:
    image: redis:8
    container_name: urban-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina em infra/.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [urban-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: urban-rabbitmq
    hostname: urban-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina em infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina em infra/.env}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [urban-net]

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: urban-garage
    restart: unless-stopped
    # DEV: --single-node --default-bucket criam layout, chave e bucket sozinhos.
    # Em produção o init é feito manualmente (garage layout assign/apply).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?defina em infra/.env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina em infra/.env}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?defina em infra/.env}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?defina em infra/.env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?defina em infra/.env}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?defina em infra/.env}
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks: [urban-net]

  # ==================== PERFIL: tools ====================
  pgadmin:
    image: dpage/pgadmin4:9.18
    container_name: urban-pgadmin
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:?defina em infra/.env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?defina em infra/.env}
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [urban-net]

  seq:
    image: datalust/seq:2026.1
    container_name: urban-seq
    profiles: [tools]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # DEV: sem autenticação. Nunca usar assim em produção.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      # A porta 80 do container atende interface web e ingestão de logs
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    volumes:
      - seq-data:/data
    networks: [urban-net]

  # ==================== PERFIL: observability ====================
  jaeger:
    # Fixado em 2.20.x: a partir da 2.21 o Jaeger removeu a API /api/services,
    # que o plugin do Grafana ainda usa (grafana/grafana-jaeger-datasource#87).
    image: jaegertracing/jaeger:2.20.0
    container_name: urban-jaeger
    profiles: [observability]
    restart: unless-stopped
    # Armazenamento em memória: os traces somem ao reiniciar (suficiente em dev)
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
      - "127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318"
    networks: [urban-net]

  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: urban-prometheus
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [urban-net]

  loki:
    image: grafana/loki:3.7.9
    container_name: urban-loki
    profiles: [observability]
    restart: unless-stopped
    # Usa a configuração padrão da imagem (armazenamento em /loki, sem autenticação)
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
      - loki-data:/loki
    networks: [urban-net]

  grafana:
    image: grafana/grafana:13.2.4
    container_name: urban-grafana
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:?defina em infra/.env}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina em infra/.env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [urban-net]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  garage-meta:
  garage-data:
  pgadmin-data:
  seq-data:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  urban-net:
    name: urban-net
