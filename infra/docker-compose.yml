# Urban - infraestrutura local: serviços essenciais
# Uso (a partir da raiz do repositório):
#   docker compose -f infra/docker-compose.yml up -d
name: urban

services:
  postgres:
    image: postgres:18
    container_name: urban-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina em infra/.env}
      POSTGRES_USER: ${POSTGRES_USER:?defina em infra/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina em infra/.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: o volume é montado em /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [urban-net]

  redis:
    image: redis:8
    container_name: urban-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?defina em infra/.env}", "--appendonly", "yes"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [urban-net]

  rabbitmq:
    image: rabbitmq:4-management
    container_name: urban-rabbitmq
    hostname: urban-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?defina em infra/.env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina em infra/.env}
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [urban-net]

  garage:
    image: dxflrs/garage:v2.4.1
    container_name: urban-garage
    restart: unless-stopped
    # DEV: --single-node --default-bucket criam layout, chave e bucket sozinhos.
    # Em produção o init é feito manualmente (garage layout assign/apply).
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?defina em infra/.env}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?defina em infra/.env}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN:?defina em infra/.env}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_DEFAULT_ACCESS_KEY:?defina em infra/.env}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_DEFAULT_SECRET_KEY:?defina em infra/.env}
      GARAGE_DEFAULT_BUCKET: ${GARAGE_DEFAULT_BUCKET:?defina em infra/.env}
    ports:
      - "127.0.0.1:${GARAGE_S3_PORT:-3900}:3900"
      - "127.0.0.1:${GARAGE_ADMIN_PORT:-3903}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    networks: [urban-net]

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  garage-meta:
  garage-data:

networks:
  urban-net:
    name: urban-net
