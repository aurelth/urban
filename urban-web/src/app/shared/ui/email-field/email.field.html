<mat-form-field appearance="outline" class="w-full">
  <mat-label>E-mail</mat-label>
  <input
    matInput
    type="email"
    formControlName="email"
    [attr.autocomplete]="autocomplete()"
    inputmode="email"
    autocapitalize="none"
    spellcheck="false"
    required
  />
  <mat-error>
    @if (control?.hasError('required')) {
      Informe o e-mail
    } @else {
      Informe um e-mail válido
    }
  </mat-error>
</mat-form-field>
