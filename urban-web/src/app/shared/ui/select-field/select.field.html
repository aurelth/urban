<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
  <mat-label>{{ label() }}</mat-label>
  <urban-menu-select
    [formControlName]="name()"
    [attr.formControlName]="name()"
    [options]="menuOptions()"
  />
  @if (hint(); as text) {
    <mat-hint>{{ text }}</mat-hint>
  }
  <mat-error>{{ errorMessage() }}</mat-error>
</mat-form-field>
