<mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
  <mat-label>{{ label() }}</mat-label>
  @if (mask(); as kind) {
    <input
      matInput
      [urbanMask]="kind"
      [formControlName]="name()"
      [attr.formControlName]="name()"
      [attr.autocomplete]="autocomplete()"
      [required]="!optional()"
    />
  } @else {
    <input
      matInput
      [formControlName]="name()"
      [attr.formControlName]="name()"
      [attr.autocomplete]="autocomplete()"
      [attr.inputmode]="inputmode()"
      [required]="!optional()"
    />
  }
  @if (mask() === 'date') {
    <button
      #calendarButton
      matSuffix
      mat-icon-button
      type="button"
      data-testid="open-calendar"
      aria-label="Abrir calendário"
      aria-haspopup="dialog"
      [disabled]="control?.disabled ?? false"
      (click)="openCalendar()"
    >
      <mat-icon svgIcon="calendar_month" />
    </button>
  }
  @if (hint(); as text) {
    <mat-hint>{{ text }}</mat-hint>
  }
  <mat-error>{{ errorMessage() }}</mat-error>
</mat-form-field>
@if (mask() === 'date') {
  @defer (when calendarRequested()) {
    @if (calendarRequested()) {
      <urban-calendar-popup
        [value]="calendarValue()"
        [birthDate]="birthDate()"
        (picked)="pickDate($event)"
        (closed)="closeCalendar()"
      />
    }
  }
}
