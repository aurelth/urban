@if (error(); as message) {
  <p role="alert" class="mb-4 flex items-start gap-2 text-error">
    <mat-icon svgIcon="error" aria-hidden="true" />
    <span>{{ message }}</span>
  </p>
}

<button mat-flat-button type="submit" class="mt-2" [disabled]="busy()">
  @if (busy()) {
    {{ busyLabel() }}
  } @else {
    {{ label() }}
  }
</button>
