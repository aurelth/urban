<section class="mx-auto max-w-5xl p-6">
  <h1 class="mb-1 text-3xl font-semibold" urbanFadeIn>Urban</h1>
  <p class="mb-6 text-on-surface-variant" urbanFadeIn [urbanFadeInDelay]="0.05">
    Gestao condominial
  </p>

  <div class="grid gap-4 md:grid-cols-3">
    @for (modulo of modulos; track modulo.titulo) {
      <mat-card appearance="outlined" urbanFadeIn [urbanFadeInDelay]="0.1 + $index * 0.08">
        <mat-card-header>
          <mat-card-title>{{ modulo.titulo }}</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <p class="text-on-surface-variant">{{ modulo.descricao }}</p>
        </mat-card-content>
      </mat-card>
    }
  </div>
</section>
