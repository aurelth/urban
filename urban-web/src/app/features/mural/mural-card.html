<article
  class="relative overflow-hidden rounded-xl border p-4 pl-6 transition-colors"
  [class]="frameClasses()"
  data-testid="mural-card"
  [attr.data-unread]="unread()"
>
  <span aria-hidden="true" class="absolute inset-y-0 left-0 w-1.5" [class]="accent()"></span>

  <div class="mb-3 flex flex-wrap items-center gap-2">
    <span
      class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium"
      [class]="categoryTone()"
      data-testid="category"
    >
      <mat-icon class="size-[14px]!" [svgIcon]="icon()" aria-hidden="true" />
      {{ categoryText() }}
    </span>
    <span
      class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium"
      [class]="scopeTone()"
      data-testid="scope"
      >{{ scopeText() }}</span
    >
    @if (unread()) {
      <span
        class="inline-flex items-center rounded-full bg-on-surface px-2.5 py-0.5 text-xs font-semibold text-surface"
        data-testid="new-badge"
        >Novo</span
      >
    }
    <time
      class="ml-auto text-xs text-on-surface-variant"
      data-testid="published"
      [attr.datetime]="item().createdAt"
      [attr.title]="publishedAt()"
      >{{ published() }}</time
    >
  </div>

  <h3 class="m-0 mb-2 text-lg leading-snug" [class]="unread() ? 'font-semibold' : 'font-medium'">
    {{ item().title }}
  </h3>
  <urban-expandable-text [text]="item().body" />

  <div class="mt-3 flex flex-wrap items-center justify-between gap-3">
    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 text-sm">
      @if (item().read) {
        <span
          class="inline-flex items-center gap-1 text-on-surface-variant"
          data-testid="read-state"
        >
          <span class="inline-flex text-success"
            ><mat-icon class="size-[18px]!" svgIcon="check_circle" aria-hidden="true"
          /></span>
          Lido{{ item().readAt ? ' em ' + formatMoment(item().readAt!) : '' }}
        </span>
      }
      @if (item().updatedAt; as updatedAt) {
        <span
          class="inline-flex items-center gap-1 text-on-surface-variant"
          data-testid="edited"
          [attr.title]="'Editado em ' + formatMoment(updatedAt)"
        >
          <mat-icon class="size-[18px]!" svgIcon="edit_note" aria-hidden="true" />
          Editado
        </span>
      }
    </div>
    @if (unread()) {
      <button
        mat-stroked-button
        type="button"
        data-testid="mark-read"
        [attr.aria-label]="'Marcar como lido: ' + item().title"
        [disabled]="marking()"
        (click)="markRead.emit()"
      >
        <mat-icon svgIcon="done_all" aria-hidden="true" />
        Marcar como lido
      </button>
    }
  </div>
</article>
