<h2 mat-dialog-title>Encerrar {{ config.expense.description }}</h2>
<form [formGroup]="form" (ngSubmit)="confirm()" novalidate>
  <mat-dialog-content>
    <p class="mt-0 text-on-surface-variant">
      A despesa deixa de gerar lançamentos depois do mês escolhido. Os meses já abertos continuam
      como estão.
    </p>
    <urban-select-field name="lastMonth" label="Último mês cobrado" [options]="months" />

    @if (error(); as message) {
      <p role="alert" class="flex items-start gap-2 text-error">
        <mat-icon svgIcon="error" aria-hidden="true" />
        <span>{{ message }}</span>
      </p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      data-testid="cancel"
      [disabled]="busy()"
      (click)="ref.close(false)"
    >
      Cancelar
    </button>
    <button mat-flat-button type="submit" [disabled]="busy()">
      @if (busy()) {
        Salvando
      } @else {
        Encerrar despesa
      }
    </button>
  </mat-dialog-actions>
</form>
