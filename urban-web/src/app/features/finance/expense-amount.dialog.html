<h2 mat-dialog-title>Reajustar {{ config.expense.description }}</h2>
<form [formGroup]="form" (ngSubmit)="confirm()" novalidate>
  <mat-dialog-content>
    <p class="mt-0 mb-6 text-on-surface-variant">
      O novo valor vale a partir do mês escolhido. Os meses anteriores continuam como estavam.
    </p>
    <div class="mb-3 grid gap-x-4 gap-y-3 sm:grid-cols-2">
      <urban-select-field name="fromMonth" label="Vale a partir de" [options]="months" />
      <urban-text-field
        name="amount"
        label="Novo valor mensal (R$)"
        inputmode="decimal"
        [errors]="amountErrors"
      />
    </div>

    @if (error(); as message) {
      <p role="alert" class="flex items-start gap-2 text-error">
        <mat-icon svgIcon="error" aria-hidden="true" />
        <span>{{ message }}</span>
      </p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      data-testid="cancel"
      [disabled]="busy()"
      (click)="ref.close(false)"
    >
      Cancelar
    </button>
    <button mat-flat-button type="submit" [disabled]="busy()">
      @if (busy()) {
        Salvando
      } @else {
        Reajustar valor
      }
    </button>
  </mat-dialog-actions>
</form>
