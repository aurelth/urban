<h2 mat-dialog-title>Apagar a tarifa de {{ name }}</h2>
<form (submit)="$event.preventDefault(); confirm()" novalidate>
  <mat-dialog-content>
    <p class="mt-0">
      Os meses que ainda vão fechar passam a usar a tarifa anterior, se houver. Os meses já fechados
      não mudam
    </p>

    @if (error(); as message) {
      <p role="alert" class="flex items-start gap-2 text-error">
        <mat-icon svgIcon="error" aria-hidden="true" />
        <span>{{ message }}</span>
      </p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      data-testid="cancel"
      [disabled]="busy()"
      (click)="ref.close(false)"
    >
      Cancelar
    </button>
    <button mat-flat-button type="submit" [disabled]="busy()">
      @if (busy()) {
        Apagando
      } @else {
        Apagar tarifa
      }
    </button>
  </mat-dialog-actions>
</form>
