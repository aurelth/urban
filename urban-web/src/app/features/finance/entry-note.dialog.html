<h2 mat-dialog-title>Observação de {{ config.entry.description }}</h2>
<form [formGroup]="form" (ngSubmit)="confirm()" novalidate>
  <mat-dialog-content>
    <p class="mb-6 text-on-surface-variant">{{ explanation }}</p>
    <urban-text-field
      name="note"
      label="Observação"
      [optional]="true"
      [hint]="counter()"
      [errors]="noteErrors"
    />

    @if (error(); as message) {
      <p role="alert" class="flex items-start gap-2 text-error">
        <mat-icon svgIcon="error" aria-hidden="true" />
        <span>{{ message }}</span>
      </p>
    }
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button
      mat-button
      type="button"
      data-testid="cancel"
      [disabled]="busy()"
      (click)="ref.close(false)"
    >
      Cancelar
    </button>
    <button mat-flat-button type="submit" [disabled]="busy() || !changed()">
      @if (busy()) {
        Salvando
      } @else {
        Salvar observação
      }
    </button>
  </mat-dialog-actions>
</form>
