<urban-link-request-card
  heading="Criar conta"
  intro="Cadastro de síndicos. Informe seu e-mail para receber o link de confirmação"
  [send]="register"
>
  <ng-template #notice let-email>
    <p>
      Se o endereço <strong>{{ email }}</strong> estiver correto, você receberá em instantes um link
      para confirmar o cadastro e criar sua senha. O link vale por 24 horas
    </p>
  </ng-template>
  Já tem conta?
  <a routerLink="/entrar" class="text-primary underline">Entrar</a>
</urban-link-request-card>
