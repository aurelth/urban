<mat-card appearance="outlined">
  <mat-card-content class="p-6">
    @if (sentTo(); as email) {
      <div class="flex flex-col items-center gap-3 text-center" role="status">
        <mat-icon svgIcon="mark_email_read" aria-hidden="true" />
        <h1 class="text-3xl font-semibold tracking-tight">Verifique seu e-mail</h1>
        <ng-container
          [ngTemplateOutlet]="notice()"
          [ngTemplateOutletContext]="{ $implicit: email }"
        />
        <p class="text-on-surface-variant">
          Não chegou? Confira a caixa de spam e, depois de 1 minuto, peça de novo
        </p>
        <button mat-button type="button" (click)="changeEmail()">Usar outro e-mail</button>
        <ng-content select="[sentAction]" />
      </div>
    } @else {
      <h1 class="mb-1 text-center text-3xl font-semibold tracking-tight">{{ heading() }}</h1>
      <p class="mb-6 text-center text-on-surface-variant">{{ intro() }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col" novalidate>
        <urban-email-field />

        <urban-form-submit
          label="Enviar link"
          busyLabel="Enviando"
          [busy]="submitting()"
          [error]="error()"
        />
      </form>

      <p class="mt-6 text-center text-on-surface-variant">
        <ng-content />
      </p>
    }
  </mat-card-content>
</mat-card>
