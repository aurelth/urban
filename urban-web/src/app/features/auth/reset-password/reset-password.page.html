<mat-card appearance="outlined">
  <mat-card-content class="p-6">
    @if (done()) {
      <div class="flex flex-col items-center gap-3 text-center" role="status">
        <span class="inline-flex text-success">
          <mat-icon svgIcon="check_circle" aria-hidden="true" />
        </span>
        <h1 class="text-3xl font-semibold tracking-tight text-success">Senha alterada</h1>
        <p>Por segurança, os outros acessos à sua conta foram encerrados. Entre com a nova senha</p>
        <a mat-flat-button routerLink="/entrar">Entrar</a>
      </div>
    } @else if (blockedMessage(); as message) {
      <urban-link-problem-notice
        [heading]="linkError() ? 'Link inválido' : 'Link incompleto'"
        [message]="message"
        actionLabel="Pedir novo link"
        actionLink="/esqueci-a-senha"
      />
    } @else {
      <h1 class="mb-1 text-center text-3xl font-semibold tracking-tight">Redefinir senha</h1>
      <p class="mb-6 text-center text-on-surface-variant">Escolha a nova senha da sua conta</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col" novalidate>
        <urban-password-field autocomplete="new-password" [policy]="true" />

        <urban-form-submit
          label="Salvar senha"
          busyLabel="Salvando"
          [busy]="submitting()"
          [error]="error()"
        />
      </form>
    }
  </mat-card-content>
</mat-card>
