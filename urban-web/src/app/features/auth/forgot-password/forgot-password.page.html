<urban-link-request-card
  heading="Esqueci a senha"
  intro="Informe o e-mail da sua conta para receber o link de redefinição"
  [send]="requestLink"
>
  <ng-template #notice let-email>
    <p>
      Se o endereço <strong>{{ email }}</strong> estiver cadastrado, você receberá em instantes um
      link para criar uma nova senha. O link vale por 1 hora
    </p>
  </ng-template>
  <a sentAction mat-button routerLink="/entrar">Voltar para a entrada</a>
  Lembrou a senha?
  <a routerLink="/entrar" class="text-primary underline">Entrar</a>
</urban-link-request-card>
