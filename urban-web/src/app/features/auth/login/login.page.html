<mat-card appearance="outlined">
  <mat-card-content class="p-6">
    <h1 class="mb-1 text-center text-3xl font-semibold tracking-tight">Entrar</h1>
    <p class="mb-6 text-center text-on-surface-variant">Use o e-mail e a senha da sua conta</p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col" novalidate>
      <urban-email-field autocomplete="username" />

      <urban-password-field />
      <a routerLink="/esqueci-a-senha" class="mb-4 self-end text-primary underline">
        Esqueci a senha
      </a>

      <urban-form-submit
        label="Entrar"
        busyLabel="Entrando"
        [busy]="submitting()"
        [error]="error()"
      />
    </form>

    <p class="mt-6 text-center text-on-surface-variant">
      Ainda não tem conta?
      <a routerLink="/cadastrar" class="text-primary underline">Criar conta</a>
    </p>
  </mat-card-content>
</mat-card>
