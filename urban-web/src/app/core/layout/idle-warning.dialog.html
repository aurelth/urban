<h2 mat-dialog-title>Você ainda está aí?</h2>
<mat-dialog-content>
  Por segurança, a sessão será encerrada em {{ countdown() }} por falta de atividade
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-flat-button [mat-dialog-close]="true">Continuar conectado</button>
</mat-dialog-actions>
