<mat-toolbar>
  <span class="text-xl font-bold tracking-tight"><urban-brand-link /></span>
  <span class="flex-1"></span>
  @if (session.user(); as user) {
    <span data-testid="current-user" class="mr-2 hidden text-sm text-on-surface-variant sm:inline">
      {{ accountLabel(user) }} · {{ roleLabel(user.role) }}
    </span>
  }
  @if (showProfile()) {
    <a
      mat-button
      data-testid="nav-profile"
      routerLink="/condominio/meus-dados"
      routerLinkActive="font-semibold"
      ariaCurrentWhenActive="page"
    >
      <mat-icon svgIcon="apartment" />
      <span class="hidden sm:inline">Meus dados</span>
    </a>
  }
  <a
    mat-button
    data-testid="nav-account"
    routerLink="/conta"
    routerLinkActive="font-semibold"
    ariaCurrentWhenActive="page"
  >
    <mat-icon svgIcon="account_circle" />
    <span class="hidden sm:inline">Minha conta</span>
  </a>
  <button
    mat-icon-button
    type="button"
    [attr.aria-label]="theme.isDark() ? 'Usar tema claro' : 'Usar tema escuro'"
    (click)="theme.toggle()"
  >
    <mat-icon [svgIcon]="theme.isDark() ? 'light_mode' : 'dark_mode'" />
  </button>
  <button mat-button type="button" data-testid="sign-out" (click)="signOut()">
    <mat-icon svgIcon="logout" />
    Sair
  </button>
</mat-toolbar>
<main>
  <router-outlet />
</main>
